<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SoisFier</title>
<meta name="description" content="Routines, étoiles et récompenses pour les enfants.">
<meta name="theme-color" content="#2E8B57">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --sky:#E3F1FB; --paper:#FFFFFF; --leaf:#2E8B57; --leaf-d:#1F6B41; --leaf-l:#DDF2E5;
  --sun:#FFC233; --sun-l:#FFF1C9; --earth:#4A2E1F; --muted:#7A6A5F; --poppy:#E8484F;
  --line:#CFE2EF; --lift:0 2px 0 rgba(74,46,31,.10);
  --display:"Fredoka", ui-rounded, "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --sky:#0F2219; --paper:#18322A; --leaf:#5CC48A; --leaf-d:#3FA36D; --leaf-l:#1E4535;
    --sun:#FFCB4D; --sun-l:#3A3318; --earth:#F1ECE4; --muted:#A9B8AF; --poppy:#FF6B70; --line:#24463A; --lift:none; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--sky);color:var(--earth);font:17px/1.5 var(--body);-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px)}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0}
h1{font-size:1.75rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px calc(110px + env(safe-area-inset-bottom,0px))}
.muted{color:var(--muted)}

/* En-tête */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;justify-content:space-between;
  max-width:560px;margin:0 auto;padding:10px 16px;background:var(--sky)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:1.15rem}
.brand svg{width:30px;height:30px}
.pill{font-size:.8rem;padding:3px 10px;border-radius:999px;background:var(--sun-l)}

/* Navigation basse */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;gap:4px;
  background:var(--paper);border-top:2px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{flex:1;min-width:0;max-width:140px;border:0;background:none;padding:6px 4px;border-radius:14px;display:flex;flex-direction:column;
  align-items:center;gap:2px;font-size:.78rem;color:var(--muted)}
.tabbar button span{font-size:1.35rem;line-height:1}
.tabbar button.on{color:var(--leaf-d);background:var(--leaf-l);font-weight:700}

/* Boutons */
.btn{border:0;border-radius:999px;background:var(--leaf);color:#fff;font-weight:700;padding:12px 20px;box-shadow:var(--lift)}
.btn:disabled{opacity:.45}
.btn.ghost{background:transparent;color:var(--leaf-d);box-shadow:inset 0 0 0 2px var(--leaf)}
.btn.danger{background:var(--poppy)}
.btn.danger.ghost{background:transparent;color:var(--poppy);box-shadow:inset 0 0 0 2px var(--poppy)}
.btn.sm{padding:8px 14px;font-size:.92rem}
.btn.wide{width:100%}
.link{border:0;background:none;color:var(--leaf-d);text-decoration:underline;padding:6px 2px;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}

/* Puces enfants */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chip{border:0;border-radius:999px;padding:8px 14px;background:var(--paper);white-space:nowrap;box-shadow:inset 0 0 0 2px var(--line)}
.chip.on{background:var(--c);color:#fff;box-shadow:none;font-weight:700}

/* Jour */
.daynav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.daynav button{width:44px;height:44px;border-radius:50%;border:0;background:var(--paper);font-size:1.5rem;box-shadow:var(--lift)}
.daynav button:disabled{opacity:.3}

.tip{display:flex;gap:10px;align-items:flex-start;background:var(--sun-l);border-radius:18px;padding:12px 14px;margin-bottom:14px}
.tip p{margin:0;font-size:.95rem}

/* Bloc enfant (parent) */
.kid{background:var(--paper);border-radius:24px;padding:14px;margin-bottom:16px;box-shadow:var(--lift);border-top:6px solid var(--c)}
.kid-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.kid-head>div:nth-child(2){flex:1}
.kid-plant svg{width:58px;height:78px}
.meta{margin:2px 0 0;color:var(--muted);font-size:.9rem;display:flex;gap:12px;flex-wrap:wrap}
.ring{--p:0;width:54px;height:54px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--leaf) calc(var(--p)*1%), var(--line) 0)}
.ring span{width:42px;height:42px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-weight:700;font-size:.88rem}

/* Lignes de routines */
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rt{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:0;border-radius:16px;padding:10px 12px;
  background:var(--sky)}
.rt-emo{font-size:1.6rem;width:42px;height:42px;display:grid;place-items:center;background:var(--paper);border-radius:12px;flex:none}
.rt-txt{flex:1;display:flex;flex-direction:column;min-width:0}
.rt-txt small{color:var(--muted)}
.rt-stars{font-weight:700;font-size:.92rem;white-space:nowrap}
.pot{width:32px;height:32px;border-radius:9px 9px 14px 14px;border:3px solid var(--line);display:grid;place-items:center;flex:none;font-size:1rem}
.rt.done{background:var(--leaf-l)}
.rt.done .pot{border-color:var(--leaf);background:var(--paper)}
.rt.done b{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--leaf)}
.grp{margin:18px 0 8px;color:var(--muted)}
.empty{color:var(--muted);background:var(--paper);border-radius:18px;padding:14px}

/* Récompenses */
.balance{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;background:var(--sun-l);border-radius:20px;padding:14px 16px;margin:8px 0}
.balance .big{font-family:var(--display);font-size:2rem;font-weight:600}
.glist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.gift{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:18px;padding:10px 12px;box-shadow:var(--lift)}
.gift-main{flex:1;display:flex;align-items:center;gap:12px;border:0;background:none;text-align:left;padding:0}
.gift-main span:last-child{display:flex;flex-direction:column}
.gift-main small{color:var(--muted)}
.g-emo{font-size:1.8rem}
.hist{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.hist li{display:flex;gap:10px;align-items:center;background:var(--paper);border-radius:14px;padding:8px 12px;font-size:.95rem}
.hist li span:first-child{flex:1}

/* Famille */
.sec{background:var(--paper);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:var(--lift)}
.sec h2{margin-bottom:10px}
.sec p{margin:6px 0}
.krow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:2px solid var(--sky)}
.krow:first-of-type{border-top:0}
.krow>svg{width:44px;height:58px}
.krow .grow{flex:1}
.krow .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.dev{font-size:.88rem;color:var(--muted);display:flex;gap:8px;align-items:center;margin:2px 0}

/* Feuille (dialog) */
dialog#sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:560px;max-height:92vh;border-radius:28px 28px 0 0;
  background:var(--paper);color:var(--earth)}
dialog#sheet::backdrop{background:rgba(20,30,25,.45)}
.sheet-in{padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));overflow:auto;max-height:92vh}
.sheet-in h2{margin-bottom:14px}
.sheet-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.f{display:flex;flex-direction:column;gap:6px;margin:12px 0;font-weight:700;font-size:.95rem}
.f input,.f select{font-weight:400;border:2px solid var(--line);border-radius:14px;padding:11px 12px;background:var(--sky);font-size:1rem}
.f.two{flex-direction:row;gap:12px}
.f.two label{flex:1;display:flex;flex-direction:column;gap:6px}
.check{display:flex;gap:10px;align-items:flex-start;margin:12px 0}
.check input{width:22px;height:22px;flex:none;accent-color:var(--leaf)}
.emo-row{display:flex;flex-wrap:wrap;gap:6px}
.emo-in{width:64px;text-align:center;font-size:1.4rem!important;padding:6px!important}
.emo{width:44px;height:44px;border:0;border-radius:12px;background:var(--sky);font-size:1.4rem}
.emo-row{align-items:center}
.emo-box{max-height:230px;overflow-y:auto;border:2px solid var(--line);border-radius:14px;padding:8px;margin-top:6px}
.emo-grp{margin-bottom:8px}
.emo-grp small{display:block;color:var(--muted);font-weight:700;margin:0 0 4px 2px}
.emo.on{box-shadow:inset 0 0 0 3px var(--leaf)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:0;border-radius:999px;padding:8px 12px;background:var(--sky);font-weight:400}
.seg button.on{background:var(--leaf);color:#fff;font-weight:700}
.seg.wide{background:var(--paper);border-radius:999px;padding:4px;margin:16px 0;flex-wrap:nowrap}
.seg.wide button{flex:1;background:none}
.seg.wide button.on{background:var(--leaf)}
.days{display:flex;gap:6px}
.day{flex:1;height:42px;border:0;border-radius:12px;background:var(--sky);font-weight:700}
.day.on{background:var(--leaf);color:#fff}
.presets{display:flex;gap:10px;flex-wrap:wrap}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent}
.sw.on{border-color:var(--earth)}
.tpl{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.tpl label{display:flex;gap:10px;align-items:center;background:var(--sky);border-radius:14px;padding:10px 12px;font-weight:400}
.tpl input{width:22px;height:22px;accent-color:var(--leaf)}
.tpl .had{opacity:.5}
.code{font-family:var(--display);font-size:2.6rem;letter-spacing:.18em;text-align:center;background:var(--sun-l);border-radius:20px;padding:16px;margin:10px 0;user-select:all}
.pin{font-size:2rem!important;letter-spacing:.4em;text-align:center}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;
  background:var(--earth);color:var(--paper);padding:10px 18px;border-radius:999px;max-width:90vw;font-weight:700;
  opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#toast.err{background:var(--poppy);color:#fff}

/* Connexion */
.auth{padding-top:24px}
.auth-hero{text-align:center}
.auth-hero svg{width:140px;height:154px}
.auth-hero h1{font-size:2.6rem;color:var(--leaf-d)}
.auth-hero p{margin:4px 0 0;color:var(--muted)}
.card{background:var(--paper);border-radius:24px;padding:16px;margin:12px 0;box-shadow:var(--lift)}
.card.alt{background:transparent;box-shadow:inset 0 0 0 2px var(--line);text-align:center}
.card.alt p{margin:0 0 10px}
.center{text-align:center}
.loading{display:grid;place-items:center;min-height:70vh}
.loading svg{width:90px;height:100px}

/* ===== Mode enfant ===== */
.kid-top .hello{font-family:var(--display);font-weight:600;font-size:1.2rem}
.star-count{margin-left:auto;font-family:var(--display);font-weight:600;font-size:1.25rem;background:var(--sun-l);padding:4px 14px;border-radius:999px}
.lock{width:40px;height:40px;border-radius:50%;border:0;background:var(--paper);opacity:.7}
.hero{display:flex;align-items:center;gap:14px;background:var(--paper);border-radius:28px;padding:12px 16px;margin-bottom:12px;box-shadow:var(--lift)}
.hero-plant svg{width:120px;height:auto;display:block}
.hero-txt{flex:1}
.hero-txt h1{font-size:1.6rem;color:var(--leaf-d)}
.hero-txt p{margin:6px 0 0;font-size:.95rem}
.bar{height:14px;border-radius:999px;background:var(--sky);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:999px}
.today-count{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:6px 4px 4px}
.kcards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.kcard{width:100%;display:flex;align-items:center;gap:14px;border:0;border-radius:22px;padding:12px 14px;background:var(--paper);text-align:left;
  box-shadow:var(--lift);min-height:78px}
.k-emo{font-size:2.3rem;width:58px;height:58px;display:grid;place-items:center;background:var(--sky);border-radius:18px;flex:none}
.k-txt{flex:1;display:flex;flex-direction:column}
.k-txt b{font-size:1.12rem}
.k-txt small{color:var(--muted)}
.k-stars{font-size:.95rem;white-space:nowrap}
.k-pot{width:46px;height:46px;flex:none;border-radius:12px 12px 20px 20px;border:4px solid var(--line);display:grid;place-items:center;font-size:1.5rem;font-weight:700;color:#fff}
.kcard.done{background:var(--leaf-l)}
.kcard.done .k-pot{background:var(--leaf);border-color:var(--leaf)}
.kcard.done .k-emo{background:var(--paper)}
.k-timer{margin:-4px 0 4px 72px;align-self:flex-start;border:0;border-radius:999px;background:var(--sun);color:#3B2A00;font-weight:700;padding:8px 14px}
.kgift{display:flex;align-items:center;gap:14px;background:var(--paper);border-radius:22px;padding:12px 14px;box-shadow:var(--lift)}
.kgift .g-emo{font-size:2.4rem}
.kgift .grow{flex:1}
.kgift b{font-size:1.1rem;display:block}
.week{display:flex;justify-content:space-between;background:var(--paper);border-radius:22px;padding:14px 10px;box-shadow:var(--lift)}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:.9rem}
.wd .ring{width:38px;height:38px}
.wd .ring span{width:28px;height:28px;font-size:.8rem}
.wd.today{color:var(--leaf-d)}
.wd.future{opacity:.4}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.badge{background:var(--paper);border-radius:18px;padding:12px 6px;text-align:center;box-shadow:var(--lift);font-size:.82rem;line-height:1.25}
.badge .be{font-size:2rem;display:block;margin-bottom:4px}
.badge.off{opacity:.35;filter:grayscale(1)}
.streak{font-family:var(--display);font-weight:600;font-size:1.1rem;margin:10px 4px}

/* Validation et étoiles cassées */
.rt.pending{background:var(--sun-l)}
.rt.pending .pot{border-color:var(--sun)}
.kcard.pending{background:var(--sun-l)}
.kcard.pending .k-pot{border-color:var(--sun);color:var(--earth);font-size:1.2rem}
.k-stars.wait{opacity:.4}
.validate{background:var(--sun-l);border-radius:24px;padding:14px;margin-bottom:16px}
.v-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.vlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.vlist li{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:16px;padding:8px 10px}
.vlist .grow{flex:1;display:flex;flex-direction:column;min-width:0}
.vlist small{color:var(--muted)}
.vbtn{width:44px;height:44px;flex:none;border-radius:50%;border:0;font-size:1.15rem;font-weight:700}
.vbtn.yes{background:var(--leaf);color:#fff}
.vbtn.no{background:var(--paper);color:var(--poppy);box-shadow:inset 0 0 0 2px var(--poppy)}
.pen{width:100%;display:flex;justify-content:space-between;gap:10px;border:0;border-radius:14px;padding:12px;background:var(--sky);text-align:left}
.bstar{vertical-align:-4px;flex:none}
.small{font-size:.88rem}
.wait-note{margin:4px 0 0;font-size:.92rem;color:var(--muted)}

/* Jardin */
.pot-art svg{display:block;width:100%;height:auto}
.days14{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.d14{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:9px}
.d14.good{background:var(--leaf);border-color:var(--leaf)}
.d14.miss{background:var(--paper)}
.d14.neutral{background:var(--line);border-color:var(--line);transform:scale(.6)}
.d14.today{border-color:var(--sun);border-width:3px}
.d14.future{opacity:.35}
.scene{border-radius:20px;overflow:hidden;background:var(--paper);box-shadow:var(--lift);margin:8px 0 14px}
.scene svg{display:block;width:100%;height:auto}
.scene p{margin:0;padding:8px 14px 12px;font-weight:700}
.yr{display:flex;flex-wrap:wrap;gap:8px}
.grade{font-family:var(--display);font-size:1.6rem;text-align:center;color:var(--leaf-d);margin:6px 0}
.tier-h{margin:18px 0 6px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tier-h small{color:var(--muted);font-family:var(--body);font-weight:400}
.gift small.when{display:block;color:var(--muted)}
.banner{background:var(--sun-l);border-radius:16px;padding:12px 14px;margin:10px 0}
.banner p{margin:0 0 8px}
.osm li label{align-items:flex-start}
.osm small{color:var(--muted);display:block}

/* Minuteur */
.timer{text-align:center}
.timer svg{width:220px;height:220px}
.timer .tleft{font-family:var(--display);font-size:2.6rem;font-weight:600}

/* Animations (réponse à une action) */
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.12) rotate(-3deg)}100%{transform:scale(1)}}
.bump{animation:bump .6s ease-out}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.hero-plant .sway{transform-origin:100px 166px;animation:sway 5s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){ .bump,.hero-plant .sway{animation:none} }
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}

/* Impression */
#print{display:none}
@media print{
  body{background:#fff;color:#000;padding:0}
  body>*:not(#print){display:none!important}
  #print{display:block;font-family:var(--body)}
  .pp{page-break-after:always;padding:8mm}
  .pp h1{font-family:var(--display);font-size:22pt;margin-bottom:4mm}
  .pp table{width:100%;border-collapse:collapse;font-size:12pt}
  .pp th,.pp td{border:1.5px solid #444;padding:5px;text-align:center}
  .pp td.n{text-align:left}
  .pp .grp-row td{background:#eef6ee;font-weight:700;text-align:left}
  .pp .circ{display:inline-block;width:20px;height:20px;border:2px solid #333;border-radius:50%}
  .pp .off{background:#e6e6e6}
  .pp .gifts{margin-top:6mm;font-size:12pt}
}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<dialog id="sheet" aria-label="Fenêtre"></dialog>
<div id="toast" role="status"></div>
<div id="print"></div>

<script>
"use strict";
/* ================= Configuration ================= */
const CFG = {
  url: "__SUPABASE_URL__",   // injecté au déploiement depuis le secret GitHub SUPABASE_URL
  key: "__SUPABASE_KEY__"    // injecté au déploiement depuis le secret GitHub SUPABASE_KEY
};
const CFG_OK = !CFG.url.startsWith("__") && !CFG.key.startsWith("__");
let sb = null;
try { if (!CFG_OK) throw new Error("config"); sb = window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }); }
catch (e) { console.warn("Supabase indisponible", e); }

/* ================= Outils ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const app = $("#app");
const store = {
  get(k, d) { try { const v = localStorage.getItem("sf:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("sf:" + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem("sf:" + k); } catch {} }
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => iso(new Date());

  const dpr = window.devicePixelRatio || 1; c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  const x = c.getContext("2d"); x.scale(dpr, dpr);
  const cols = ["#FFC233", "#E8484F", "#2E8B57", "#3D7BD9", "#FF8FB1"];
  const P = Array.from({ length: big ? 130 : 55 }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .45, vx: (Math.random() - .5) * 9, vy: -Math.random() * 11 - 4,
    r: Math.random() * 6 + 4, a: Math.random() * 6, va: (Math.random() - .5) * .3, c: cols[(Math.random() * cols.length) | 0]
  }));
  const t0 = performance.now();
  (function frame(now) {
    const k = (now - t0) / 1600; x.clearRect(0, 0, innerWidth, innerHeight);
    P.forEach(p => { p.vy += .32; p.x += p.vx; p.y += p.vy; p.a += p.va; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.globalAlpha = Math.max(0, 1 - k); x.fillStyle = p.c; x.beginPath(); x.ellipse(0, 0, p.r, p.r * .55, 0, 0, Math.PI * 2); x.fill(); x.restore(); });
    if (k < 1) requestAnimationFrame(frame); else c.remove();
  })(t0);
}

function pMalus() {

  const list = S.pevents.filter(e => f === "all" || e.child_id === f).sort((a, b) => a.created_at < b.created_at ? 1 : -1);
  const sum = d => list.filter(e => now - new Date(e.created_at) < d * 864e5).reduce((a, e) => a + e.stars, 0);

  const byDay = []; list.forEach(e => { const k = iso(new Date(e.created_at)); const g = byDay.find(x => x.k === k); g ? g.items.push(e) : byDay.push({ k, items: [e] }); });

  return chipsM + `<div class="balance"><span class="big">${brokenStar(28)} ${sum(7)}</span><span>étoile${sum(7) > 1 ? "s cassées" : " cassée"} ces 7 derniers jours</span><span class="muted">${sum(30)} sur 30 jours, ${list.length} malus au total</span></div>

  const [c, r, w, x, z, s, m, d, f, pe, pv, b, pz, gdn, ot] = qs.map(q => q.data);

  if (rows.length) sb.from("child_badges").upsert(rows, { onConflict: "child_id,badge_key", ignoreDuplicates: true }).then(() => {}, () => {});
  store.set("parentCache", { family: S.family, me: S.me, children: c, routines: r, rewards: w, completions: x, redemptions: z, stats: S.stats, members: m, devices: d,

async function loadChild() {
  const tok = store.get("childToken");
  try {
    const { data, error } = await sb.rpc("child_state", { p_token: tok });
    if (error) throw error;
    S.cs = data; S.offline = false;
    S.cs.badges = S.cs.badges || []; S.cs.penalties = S.cs.penalties || [];
    applyQueueToState();
    const last = store.get("lastEarned"), e = S.cs.stats.earned || 0;
    let gain = null;
    if (last != null && e > last) gain = { diff: e - last };
    store.set("lastEarned", e);
    const fls = (S.cs.garden && S.cs.garden.flowers) || [], seen = store.get("seenFlowers");
    const fresh = seen == null ? [] : fls.slice(seen);
    store.set("seenFlowers", fls.length);
    if (fresh.length) setTimeout(() => bloomCeremony(fresh[fresh.length - 1]), 900);
    const routines = S.cs.routines.map(r => ({ ...r, child_id: S.cs.child.id }));
    const nb = newBadges(computeView({ child: S.cs.child, routines, completions: S.cs.completions, stats: S.cs.stats, badges: S.cs.badges, garden: S.cs.garden }));
    if (nb.length) { sb.rpc("child_award_badges", { p_token: tok, p_keys: nb }).then(() => {}, () => {}); S.cs.badges.push(...nb); }
    store.set("childCache", S.cs);
    if (gain || nb.length) setTimeout(() => {
      celebrate(true);
      const names = nb.map(k => BADGES.find(b => b.k === k)).map(b => b.e + " " + b.n).join(", ");
      toast(gain ? `+${gain.diff} ⭐ validées par tes parents !` : `Nouveau badge : ${names}`);
      if (gain && nb.length) setTimeout(() => toast(`Nouveau badge : ${names}`), 3000);
    }, 400);
  } catch (e) {
    if (/Appareil non reconnu/.test(e.message || "")) {
      store.del("childToken"); store.del("childCache"); store.del("queue");
      S.screen = "auth"; render(); toast("Ce téléphone a été déconnecté par un parent.", true); return;
    }
    S.cs = store.get("childCache"); S.offline = true;
    if (!S.cs) { S.screen = "error"; S.err = errMsg(e); }
  }
  render();
}
function applyQueueToState() {
  const q = store.get("queue", []), st = S.cs.stats;
  for (const op of q) {
    const i = S.cs.completions.findIndex(c => c.routine_id === op.rid && c.day === op.day);
    const r = S.cs.routines.find(x => x.id === op.rid); if (!r) continue;
    if (op.done && i < 0) { S.cs.completions.push({ routine_id: op.rid, day: op.day, stars: r.stars, source: op.source, validated: false }); st.pending_stars = (st.pending_stars || 0) + r.stars; st.pending_count = (st.pending_count || 0) + 1; }
    if (!op.done && i >= 0 && !S.cs.completions[i].validated) { st.pending_stars -= S.cs.completions[i].stars; st.pending_count--; S.cs.completions.splice(i, 1); }
  }
}
let flushing = false;
async function flushQueue() {
  if (flushing || !store.get("childToken")) return; flushing = true;
  try {
    let q = store.get("queue", []);
    while (q.length) {
      const op = q[0];
      let res;
      try { res = await sb.rpc("child_toggle", { p_token: store.get("childToken"), p_routine: op.rid, p_day: op.day, p_done: op.done, p_source: op.source }); }
      catch (e) { res = { error: e }; }
      if (res.error && isNetErr(res.error)) { S.offline = true; break; }
      q.shift(); store.set("queue", q);
    }
    if (!q.length && S.offline) { S.offline = false; if (S.screen === "child") await loadChild(); }
  } finally { flushing = false; }
}
function childToggle(rid, makeDone, source = "child") {
  const cs = S.cs, st = cs.stats, day = todayISO(), r = cs.routines.find(x => x.id === rid); if (!r) return;
  const i = cs.completions.findIndex(c => c.routine_id === rid && c.day === day);
  if (makeDone && i < 0) { cs.completions.push({ routine_id: rid, day, stars: r.stars, source, validated: false }); st.pending_stars = (st.pending_stars || 0) + r.stars; st.pending_count = (st.pending_count || 0) + 1; }
  else if (!makeDone && i >= 0) {
    if (cs.completions[i].validated) return toast("Tes parents ont déjà validé cette routine ✓");
    st.pending_stars -= cs.completions[i].stars; st.pending_count--; cs.completions.splice(i, 1);
  }
  else return;
  store.set("childCache", cs);
  const q = store.get("queue", []); q.push({ rid, day, done: makeDone, source }); store.set("queue", q);
  if (makeDone) {
    S.bump = true; render(); S.bump = false;
    const routines = cs.routines.map(x => ({ ...x, child_id: cs.child.id }));
    const main = dueOn(routines, cs.child.id, day, cs.completions).filter(x => !x.is_bonus);
    const all = main.length && main.every(x => cs.completions.some(c => c.routine_id === x.id && c.day === day));
    celebrate(all);

function urlB64(base64) {
  const p = "=".repeat((4 - base64.length % 4) % 4), b = (base64 + p).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(b); return Uint8Array.from([...raw].map(ch => ch.charCodeAt(0)));
}
async function getPushSub() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) throw new Error("Ce navigateur ne gère pas les notifications. Installe l'application depuis Chrome.");
  const perm = await Notification.requestPermission();
  if (perm !== "granted") throw new Error("Les notifications sont bloquées. Autorise-les dans les réglages de Chrome pour ce site.");
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    const { data: vk, error } = await sb.rpc("get_vapid_public"); if (error) throw error;
    sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64(vk) });
  }
  return sub.toJSON();
}

A.suggestOutings = () => {
  const r = { ...RADII_DEF, ...(S.radii || {}) };
  openSheet(`<h2>Sorties près de chez nous</h2><p class="muted">Recherche d'après OpenStreetMap. Ta position sert uniquement à cette recherche, elle n'est pas enregistrée. Les rayons sont partagés avec l'autre parent.</p>
    ${Object.keys(RADII_DEF).map(k => `<label class="f">${RADII_LBL[k]}<select id="rad-${k}">${RADII_OPT[k].map(v => `<option value="${v}" ${v === +r[k] ? "selected" : ""}>${v} km</option>`).join("")}</select></label>`).join("")}
    <div class="sheet-actions"><button class="btn" data-act="findOutings">Chercher autour de moi</button></div><div id="osm-res"></div>`);

A.findOutings = async () => {
  const radii = {}; Object.keys(RADII_DEF).forEach(k => radii[k] = +$("#rad-" + k).value);
  if (JSON.stringify(radii) !== JSON.stringify({ ...RADII_DEF, ...(S.radii || {}) })) {
    S.radii = radii; sb.from("families").update({ outing_radii: radii }).eq("id", S.family.id).then(() => {}, () => {});
  }
  const box = $("#osm-res"); box.innerHTML = `<p class="muted">Recherche de ta position…</p>`;
  const pos = await new Promise((res, rej) => navigator.geolocation ? navigator.geolocation.getCurrentPosition(res, () => rej(new Error("Position refusée. Autorise la localisation pour ce site dans Chrome.")), { timeout: 15000 }) : rej(new Error("Localisation indisponible sur cet appareil.")));
  const { latitude: la, longitude: lo } = pos.coords;
  box.innerHTML = `<p class="muted">Recherche des lieux… Les grands rayons peuvent prendre quelques secondes.</p>`;
  const q = `[out:json][timeout:40];(${OSM_KINDS.map(k => `nwr${k.q}(around:${radii[k.g] * 1000},${la},${lo});`).join("")});out center 600;`;
  const resp = await fetch("https://overpass-api.de/api/interpreter", { method: "POST", body: "data=" + encodeURIComponent(q), headers: { "Content-Type": "application/x-www-form-urlencoded" } });
  if (!resp.ok) throw new Error("Le service OpenStreetMap est saturé. Réessaie dans une minute ou réduis les rayons.");
  const data = await resp.json();
  const dist = p => { const t = Math.PI / 180, x = (p.lon - lo) * t * Math.cos((p.lat + la) / 2 * t), y = (p.lat - la) * t; return Math.round(Math.sqrt(x * x + y * y) * 6371e3); };
  const seen = new Set(), per = {};
  const items = data.elements.map(el => { const p = el.center || el, k = OSM_KINDS.find(o => o.m(el.tags)) || OSM_KINDS[0]; return { name: el.tags.name, k, m: dist(p) }; })
    .filter(it => it.m <= radii[it.k.g] * 1000)
    .sort((a, b) => a.m - b.m).filter(it => { const key = it.k.l + it.name; if (seen.has(key)) return false; seen.add(key); per[it.k.l] = (per[it.k.l] || 0) + 1; return per[it.k.l] <= 6; });
  S.osm = items;
  const groups = Object.keys(RADII_DEF).map(g => { const li = items.map((it, i) => ({ it, i })).filter(o => o.it.k.g === g); return li.length ? `<h3 class="tier-h">${RADII_LBL[g].split(" :")[0]}<small>jusqu'à ${radii[g]} km</small></h3><ul class="tpl osm">${li.map(({ it, i }) => `<li><label><input type="checkbox" value="${i}"><span>${it.k.e} ${esc(it.name)}<small>${it.k.l}, à ${it.m < 1000 ? it.m + " m" : (Math.round(it.m / 100) / 10) + " km"}</small></span></label></li>`).join("")}</ul>` : ""; }).join("");
  box.innerHTML = groups ? groups + `<div class="sheet-actions"><button class="btn" data-act="addOutings">Ajouter aux récompenses</button></div><p class="muted small">Données © contributeurs OpenStreetMap.</p>` : `<p class="empty">Aucun lieu trouvé. Essaie des rayons plus grands.</p>`;
};

  if (!title) return toast("Donne un nom à la récompense.", true);
  if (fixed && !(cost >= 1 && cost <= 5000)) return toast("Le prix doit être entre 1 et 5000 étoiles.", true);
  if (!fixed && !(days >= 1 && days <= 365)) return toast("La durée doit être entre 1 et 365 jours.", true);
  const who = $("#w-for").value || null, ids = who ? [who] : S.children.map(k => k.id);
  const costs = fixed ? {} : pricesFor(days, ids);
  const row = { title, emoji: $("#w-emoji").value.trim() || "🎁", tier: $("#w-tier").value, child_id: who, duration_days: fixed ? null : days, costs,
    cost: fixed ? cost : (who ? costs[who] : roundPrice(days * 5)), event_date: $("#w-date").value || null, place: $("#w-place").value.trim() || null };
  if (!fixed) await markPriced(ids);
  const id = el.dataset.id;
  const { error } = id ? await sb.from("rewards").update(row).eq("id", id) : await sb.from("rewards").insert({ ...row, family_id: S.family.id });
  if (error) throw error;
  closeSheet(); await reloadParent(id ? "Récompense enregistrée." : "Récompense ajoutée.");
};
A.delReward = async el => {
  if (!await confirmSheet("Supprimer cette récompense ?", "L'historique des échanges est conservé.", "Supprimer", true)) return;
  const { error } = await sb.from("rewards").update({ active: false }).eq("id", el.dataset.id); if (error) throw error;
  await reloadParent("Récompense supprimée.");
};
A.rewardTemplates = () => {
  const have = new Set(S.rewards.map(w => w.title.toLowerCase())), c = curChild();
  openSheet(`<h2>Référentiel de récompenses</h2><p class="muted">Proposées à tous les enfants. Le prix est calculé selon le rythme de chacun (pour ${esc(c.name)} : environ ${Math.round(rhythmOf(c.id) * 10) / 10} ⭐ par jour).</p>
    ${TIERS.filter(([k]) => k !== "event").map(([k, l, d]) => `<h3 class="tier-h">${l}<small>${d}</small></h3><ul class="tpl">${TPL_W.map((t, i) => ({ ...t, i })).filter(t => t.tier === k).map(t => { const had = have.has(t.t.toLowerCase()); return `<li><label class="${had ? "had" : ""}"><input type="checkbox" value="${t.i}" ${had ? "disabled" : ""}><span>${t.e} ${esc(t.t)} (${roundPrice(t.d * rhythmOf(c.id))} ⭐ pour ${esc(c.name)})${had ? ", déjà ajoutée" : ""}</span></label></li>`; }).join("")}</ul>`).join("")}
    <h3 class="tier-h">Événements<small>à une date précise</small></h3><p class="muted">Un spectacle, un atelier, une fête de quartier : crée-le à partir du modèle et adapte-le.</p>
    <div class="sheet-actions"><button class="btn ghost" data-act="newEvent">Créer un événement</button><button class="btn" data-act="addRewardTpl">Ajouter la sélection</button></div>`);
};
A.newEvent = () => rewardForm(null, { tier: "event", emoji: "🎪", title: "Spectacle", duration_days: 30 });
A.addRewardTpl = async () => {
  const picks = $$(".tpl input:checked", dlg).map(i => TPL_W[+i.value]).sort((a, b) => TIER_RANK[a.tier] - TIER_RANK[b.tier] || a.d - b.d);
  if (!picks.length) return toast("Coche au moins une récompense.", true);
  const ids = S.children.map(k => k.id);
  // Les niveaux restent dans l'ordre : un niveau supérieur ne peut pas coûter autant qu'un niveau inférieur
  const maxBelow = {}; ids.forEach(id => maxBelow[id] = {});
  S.rewards.filter(w => w.duration_days).forEach(w => ids.forEach(id => { const r = TIER_RANK[w.tier || "moment"], v = costFor(w, id); maxBelow[id][r] = Math.max(maxBelow[id][r] || 0, v); }));
  const rows = picks.map(t => { const costs = pricesFor(t.d, ids);
    ids.forEach(id => { const r = TIER_RANK[t.tier]; const lower = Math.max(0, ...Object.entries(maxBelow[id]).filter(([k]) => +k < r).map(([, v]) => v));
      while (costs[id] <= lower) costs[id] += stepOf(costs[id]); maxBelow[id][r] = Math.max(maxBelow[id][r] || 0, costs[id]); });
    return { family_id: S.family.id, title: t.t, emoji: t.e, tier: t.tier, duration_days: t.d, costs, cost: roundPrice(t.d * 5) }; });
  const { error } = await sb.from("rewards").insert(rows); if (error) throw error;
  await markPriced(ids); closeSheet(); await reloadParent(`${rows.length} récompense${rows.length > 1 ? "s ajoutées" : " ajoutée"}.`);
};
A.pRedeem = async el => {
  const w = S.rewards.find(x => x.id === el.dataset.id), c = curChild(), cost = costFor(w, c.id);
  if (!await confirmSheet("Échanger des étoiles ?", `${cost} étoiles de ${c.name} contre « ${w.title} ».`, "Échanger")) return;
  const { error } = await sb.from("redemptions").insert({ family_id: S.family.id, child_id: c.id, reward_id: w.id, title: w.title, emoji: w.emoji, cost }); if (error) throw error;
  celebrate(true); await reloadParent("Récompense échangée.");
};
A.cancelRedeem = async el => {
  if (!await confirmSheet("Annuler cet échange ?", "Les étoiles sont rendues à l'enfant.", "Annuler l'échange", true)) return;
  const { error } = await sb.from("redemptions").delete().eq("id", el.dataset.id); if (error) throw error;
  await reloadParent("Échange annulé, étoiles rendues.");
};

// Enfants
A.newChild = () => childForm(null);
A.editChild = el => childForm(S.children.find(c => c.id === el.dataset.id));
A.pickColor = el => { S.form.color = el.dataset.v; $$(".sw", dlg).forEach(b => b.classList.toggle("on", b === el)); };
A.saveChild = async el => {
  const name = $("#k-name").value.trim(); if (!name) return toast("Saisis un prénom.", true);
  const row = { name, emoji: $("#k-emoji").value.trim() || "🧒", color: S.form.color };
  const id = el.dataset.id;
  const res = id ? await sb.from("children").update(row).eq("id", id).select().single()
    : await sb.from("children").insert({ ...row, family_id: S.family.id, position: S.children.length }).select().single();
  if (res.error) throw res.error;
  S.currentChild = res.data.id; closeSheet();
  await reloadParent(id ? "Enregistré." : `${name} a rejoint la famille.`);
  if (!id) { S.tab = "routines"; render(); A.routineTemplates(); }
};
A.delChild = async el => {
  const c = S.children.find(k => k.id === el.dataset.id);
  if (!await confirmSheet(`Supprimer ${c.name} ?`, "Ses routines, ses étoiles et son historique seront effacés définitivement.", "Supprimer", true)) return;
  const { error } = await sb.from("children").delete().eq("id", c.id); if (error) throw error;
  await reloadParent("Supprimé.");
};
A.deviceCode = async el => {
  const c = S.children.find(k => k.id === el.dataset.id);
  const { data, error } = await sb.rpc("create_child_code", { p_child: c.id }); if (error) throw error;
  openSheet(`<h2>Téléphone de ${esc(c.name)}</h2><div class="code" aria-label="Code ${data.split("").join(" ")}">${esc(data)}</div>
    <p>Sur son téléphone, ouvre SoisFier, touche « J'ai un code enfant » et saisis ce code. Il expire dans 15 minutes.</p>
    <div class="sheet-actions"><button class="btn" data-act="closeSheetReload">Terminé</button></div>`);
};
A.closeSheetReload = async () => { closeSheet(); await reloadParent(); };
A.revokeDevice = async el => {
  if (!await confirmSheet("Déconnecter cet appareil ?", "Il faudra un nouveau code pour le reconnecter.", "Déconnecter", true)) return;
  const { error } = await sb.from("child_devices").delete().eq("id", el.dataset.id); if (error) throw error;
  await reloadParent("Appareil déconnecté.");
};
A.childHere = async el => {
  if (!await ensurePin()) return;
  const { data: code, error } = await sb.rpc("create_child_code", { p_child: el.dataset.id }); if (error) throw error;
  const r = await sb.rpc("child_pair", { p_code: code }); if (r.error) throw r.error;
  store.set("childToken", r.data.token); store.set("childFromParent", true); store.del("queue"); store.del("lastEarned"); store.del("seenFlowers");
  S.screen = "child"; S.ctab = "today"; S.cs = null; render(); await loadChild();
};
A.exitChild = async () => {
  const pin = store.get("pin");
  if (pin) {
    const v = await pinSheet("Espace parent", "Saisis le code parent pour quitter le mode enfant.");
    if (v === null) return; if (v !== pin) return toast("Code incorrect.", true);
  } else {
    const a = 6 + Math.floor(Math.random() * 4), b = 6 + Math.floor(Math.random() * 4);
    const v = await new Promise(res => {
      openSheet(`<h2>Espace parent</h2><p>Pour déconnecter ce téléphone, combien font ${a} × ${b} ?</p><label class="f">Réponse<input id="m-in" class="pin" inputmode="numeric" maxlength="3"></label>
        <div class="sheet-actions"><button class="btn ghost" id="m-no">Annuler</button><button class="btn" id="m-ok">Valider</button></div>`);
      $("#m-no").onclick = () => { closeSheet(); res(null); };
      $("#m-ok").onclick = () => { const x = $("#m-in").value; closeSheet(); res(x); };
      dlg.addEventListener("close", () => res(null), { once: true });
    });
    if (v === null) return; if (+v !== a * b) return toast("Ce n'est pas la bonne réponse.", true);
  }
  await flushQueue();
  if (store.get("cpushOn")) {
    try { const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription();
      if (sub) { await sb.rpc("push_unsubscribe", { p_endpoint: sub.endpoint }); await sub.unsubscribe(); } } catch {}
    store.set("pushOn", false);
  }
  ["childToken", "childCache", "queue", "childFromParent", "cpushOn", "lastEarned", "seenFlowers"].forEach(k => store.del(k));
  S.cs = null;
  const { data } = await sb.auth.getSession();
  if (data.session) { S.session = data.session; S.tab = "family"; await enterParent(); } else { S.screen = "auth"; render(); }
};

// Mode enfant
A.cToggle = el => { const rid = el.dataset.id, day = todayISO(); const done = S.cs.completions.some(c => c.routine_id === rid && c.day === day); childToggle(rid, !done); };
A.cRedeem = async el => {
  const w = S.cs.rewards.find(x => x.id === el.dataset.id);
  if (!await confirmSheet(`${w.emoji} ${w.title}`, `Tu échanges ${w.cost} étoiles. Tu es sûr ?`, "Oui, je choisis !")) return;
  await flushQueue();
  const { error } = await sb.rpc("child_redeem", { p_token: store.get("childToken"), p_reward: w.id });
  if (error) { if (isNetErr(error)) return toast("Il faut internet pour choisir une récompense.", true); throw error; }
  celebrate(true); await loadChild();
  openSheet(`<h2>Bravo ! ${esc(w.emoji)}</h2><p>Montre cet écran à tes parents : tu as gagné « ${esc(w.title)} ».</p><div class="sheet-actions"><button class="btn" data-act="closeSheet">Super !</button></div>`);
};
A.cTimer = el => {
  const r = S.cs.routines.find(x => x.id === el.dataset.id); const total = r.timer_minutes * 60; let left = total; let iv;
  const C = 2 * Math.PI * 92;
  openSheet(`<div class="timer"><h2>${esc(r.emoji)} ${esc(r.title)}</h2><p>Fais-le avant la fin du temps !</p>
    <svg viewBox="0 0 220 220" aria-hidden="true"><circle cx="110" cy="110" r="92" fill="none" stroke="var(--line)" stroke-width="18"/>
    <circle id="tc" cx="110" cy="110" r="92" fill="none" stroke="var(--sun)" stroke-width="18" stroke-linecap="round" transform="rotate(-90 110 110)" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg>
    <div class="tleft" id="tl" role="timer">${Math.floor(left / 60)}:${pad(left % 60)}</div>
    <div class="sheet-actions" style="justify-content:center"><button class="btn ghost" id="t-stop">Arrêter</button><button class="btn" id="t-done">J'ai fini !</button></div></div>`);
  const stop = () => clearInterval(iv);
  iv = setInterval(() => {
    left--; const tl = $("#tl"), tc = $("#tc"); if (!tl) return stop();
    tl.textContent = `${Math.floor(Math.max(left, 0) / 60)}:${pad(Math.max(left, 0) % 60)}`;
    tc.setAttribute("stroke-dashoffset", (C * (1 - Math.max(left, 0) / total)).toFixed(1));
    if (left <= 0) { stop(); tl.textContent = "Temps écoulé !"; $("#t-done").textContent = "C'est fait quand même"; if (navigator.vibrate) navigator.vibrate([200, 100, 200]); }
  }, 1000);
  $("#t-stop").onclick = () => { stop(); closeSheet(); };
  $("#t-done").onclick = () => { stop(); closeSheet(); childToggle(r.id, true, left > 0 ? "timer" : "child"); if (left > 0) toast("Défi réussi ! ⚡"); };
  dlg.addEventListener("close", stop, { once: true });
};
A.sound = el => store.set("sound", el.checked);

// Rappels
A.pushParent = async () => {
  const times = readTimes(); if (!times.length) return toast("Choisis au moins une heure.", true);
  const j = await getPushSub();
  const { error } = await sb.rpc("parent_push_subscribe", { p_family: S.family.id, p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_times: times }); if (error) throw error;
  store.set("pushOn", true); store.set("pushTimes", times); render(); toast("Rappels activés.");
};
A.pushChild = async () => {
  const times = readTimes(); if (!times.length) return toast("Choisis au moins une heure.", true);
  const j = await getPushSub();
  const { error } = await sb.rpc("child_push_subscribe", { p_token: store.get("childToken"), p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_times: times }); if (error) throw error;
  store.set("cpushOn", true); store.set("cpushTimes", times); render(); toast("Rappels activés.");
};
A.pushOff = async () => {
  const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription();
  if (sub) { await sb.rpc("push_unsubscribe", { p_endpoint: sub.endpoint }); await sub.unsubscribe(); }
  store.set(S.screen === "child" ? "cpushOn" : "pushOn", false); render(); toast("Rappels désactivés.");
};

// Famille et réglages
A.invite = () => openSheet(`<h2>Inviter un membre</h2>${relationField("Maman", "inv")}
    <div class="f"><span>Droits</span><div class="seg" role="radiogroup"><button type="button" role="radio" aria-checked="true" class="on" data-act="seg" data-group="role" data-v="parent">Parent</button><button type="button" role="radio" aria-checked="false" data-act="seg" data-group="role" data-v="helper">Proche</button></div></div>
    <div class="sheet-actions"><button class="btn" data-act="makeInvite">Créer le code</button></div>`, S.form = { role: "parent" });
A.makeInvite = async () => {
  const rel = readRelation("inv"), role = S.form.role || "parent";
  const { data, error } = await sb.rpc("create_invite", { p_family: S.family.id, p_relation: rel, p_role: role }); if (error) throw error;
  openSheet(`<h2>Inviter ${esc(rel || "un membre")}</h2><div class="code">${esc(data)}</div><p>${esc(rel || "La personne")} crée son compte SoisFier, puis choisit « Rejoindre une famille » et saisit ce code. Il est valable 48 heures. Droits : ${role === "helper" ? "proche" : "parent"}.</p>
    <div class="sheet-actions">${navigator.share ? `<button class="btn ghost" data-act="shareInvite" data-code="${esc(data)}">Partager</button>` : ""}<button class="btn" data-act="closeSheet">Terminé</button></div>`);
};
A.editMember = el => {
  const m = S.members.find(x => x.user_id === el.dataset.id), self = m.user_id === S.session?.user.id;
  S.form = { role: m.role };
  openSheet(`<h2>${esc(m.relation || m.display_name || "Membre")}</h2>${relationField(m.relation, "mem")}
    ${isParent() && !self ? `<div class="f"><span>Droits</span><div class="seg" role="radiogroup">${[["parent", "Parent"], ["helper", "Proche"]].map(([k, l]) => `<button type="button" role="radio" aria-checked="${m.role === k}" class="${m.role === k ? "on" : ""}" data-act="seg" data-group="role" data-v="${k}">${l}</button>`).join("")}</div></div>` : ""}
    <div class="sheet-actions">${isParent() && !self ? `<button class="btn danger ghost" data-act="removeMember" data-id="${m.user_id}">Retirer de la famille</button>` : ""}<button class="btn" data-act="saveMember" data-id="${m.user_id}">Enregistrer</button></div>`);
};
A.saveMember = async el => {
  const id = el.dataset.id, self = id === S.session?.user.id, row = { relation: readRelation("mem") };
  if (isParent() && !self) row.role = S.form.role;
  const { error } = await sb.from("family_members").update(row).eq("family_id", S.family.id).eq("user_id", id); if (error) throw error;
  closeSheet(); await reloadParent("Membre enregistré.");
};
A.removeMember = async el => {
  const m = S.members.find(x => x.user_id === el.dataset.id);
  if (!await confirmSheet(`Retirer ${m.relation || m.display_name || "ce membre"} ?`, "Cette personne n'aura plus accès à la famille. L'historique de ses validations est conservé.", "Retirer", true)) return;
  const { error } = await sb.from("family_members").delete().eq("family_id", S.family.id).eq("user_id", m.user_id); if (error) throw error;
  await reloadParent("Membre retiré.");
};
A.shareInvite = async el => { try { await navigator.share({ title: "SoisFier", text: `Rejoins notre famille sur SoisFier avec le code ${el.dataset.code} : ${location.origin + location.pathname}` }); } catch {} };
A.setPin = async () => {
  const p = await pinSheet("Code parent", "Choisis 4 chiffres. Ils protègent la sortie du mode enfant sur ce téléphone.");
  if (p === null) return; if (!/^\d{4}$/.test(p)) return toast("Le code doit contenir 4 chiffres.", true);
  store.set("pin", p); render(); toast("Code parent enregistré.");
};
A.renameFamily = async () => {
  openSheet(`<h2>Renommer la famille</h2><label class="f">Nom<input id="fam-name" maxlength="40" value="${esc(S.family.name)}"></label><div class="sheet-actions"><button class="btn" data-act="saveFamilyName">Enregistrer</button></div>`);
};
A.saveFamilyName = async () => {
  const name = $("#fam-name").value.trim(); if (!name) return toast("Saisis un nom.", true);
  const { error } = await sb.from("families").update({ name }).eq("id", S.family.id); if (error) throw error;
  S.family.name = name; closeSheet(); render(); toast("Nom enregistré.");
};
A.printPlan = () => {
  if (S.children.length === 1) return printPlanning([S.children[0].id]);
  openSheet(`<h2>Planning à imprimer</h2><ul class="tpl">${S.children.map(c => `<li><label><input type="checkbox" value="${c.id}" checked> ${esc(c.emoji)} ${esc(c.name)}</label></li>`).join("")}</ul>
    <div class="sheet-actions"><button class="btn" data-act="doPrint">Imprimer</button></div>`);
};
A.doPrint = () => { const ids = $$(".tpl input:checked", dlg).map(i => i.value); closeSheet(); if (ids.length) printPlanning(ids); };
A.exportData = async () => {
  const fid = S.family.id;
  const names = ["children", "routines", "rewards", "completions", "redemptions", "penalties", "penalty_events", "child_badges", "flowers", "pauses"];
  const res = await Promise.all(names.map(t => sb.from(t).select("*").eq("family_id", fid)));
  for (const q of res) if (q.error) throw q.error;
  const out = { exported_at: new Date().toISOString(), family: S.family }; names.forEach((n, i) => out[n] = res[i].data);
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `soisfier-${todayISO()}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000); toast("Copie téléchargée.");
};

/* ================= Démarrage ================= */
window.addEventListener("online", () => { flushQueue(); if (S.screen === "parent" && S.offline) enterParent(); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (S.screen === "child") { flushQueue().then(loadChild); }
  else if (S.screen === "parent" && S.family) { if (S.day > todayISO()) S.day = todayISO(); refreshParent().then(render).catch(() => {}); }
});
if (sb) sb.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY") {
    S.session = session;
    setTimeout(() => {
      openSheet(`<h2>Nouveau mot de passe</h2><label class="f">Mot de passe (6 caractères minimum)<input id="np" type="password" minlength="6" autocomplete="new-password"></label><div class="sheet-actions"><button class="btn" data-act="savePass">Enregistrer</button></div>`);
    }, 300);
  }
});
A.savePass = async () => {
  const p = $("#np").value; if (p.length < 6) return toast("6 caractères minimum.", true);
  const { error } = await sb.auth.updateUser({ password: p }); if (error) throw error;
  closeSheet(); toast("Mot de passe modifié."); await enterParent();
};

async function boot() {
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  if (!sb) { S.screen = "error"; S.err = CFG_OK ? "La connexion au service n'a pas pu démarrer. Vérifie ta connexion internet puis réessaie." : "Configuration manquante : l'app doit être publiée par la GitHub Action, qui injecte SUPABASE_URL et SUPABASE_KEY."; return render(); }
  if (store.get("childToken")) {
    S.screen = "child"; S.cs = store.get("childCache"); render();
    await flushQueue(); await loadChild(); return;
  }
  const { data } = await sb.auth.getSession();
  S.session = data.session;
  if (!S.session) { S.screen = "auth"; return render(); }
  await enterParent();
}
boot();
</script>
